<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/logo1.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eTurniej Koszalin</title>
    
    <!-- Globalne ciemne style w stylu Liquid Glass Apple -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #030305; /* Głęboka, niemal smolista czerń pasująca do menu */
        color: #f5f5f7; /* Jasny, elegancki kolor tekstów systemowych Apple */
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
      }

      /* Opcjonalny styl dla głównego kontenera aplikacji, aby treści nie chowały się pod stałym menu */
      #app {
        padding-top: 90px; /* Odstęp od góry, ponieważ menu ma 70px i fixed */
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
